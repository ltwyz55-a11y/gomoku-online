services:
  - type: web
    name: gomoku-online
    runtime: node
    region: singapore
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true

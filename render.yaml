services:
  - type: web
    name: gomoku-online
    runtime: node
    repo: https://github.com/ltwyz55-a11y/gomoku-online
    branch: main
    region: singapore
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile --prod=false && npx --yes pnpm@11.25.0 run build && npx --yes pnpm@11.25.0 run test
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
